<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <style>
      .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      @keyframes scan{0%,100%{transform:translateY(-52px)}50%{transform:translateY(52px)}}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-6px)}}
      .scan{animation:scan 4s ease-in-out infinite}
      .pl{animation:pulse 3s ease-in-out infinite}
      .dr{animation:drift 6s ease-in-out infinite}
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140d22"/><stop offset="1" stop-color="#0d0a14"/></linearGradient>
    <radialGradient id="g1" cx=".12" cy=".1" r=".6"><stop offset="0" stop-color="#7b4fd6" stop-opacity=".45"/><stop offset="1" stop-color="#7b4fd6" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx=".95" cy=".95" r=".6"><stop offset="0" stop-color="#ef5f97" stop-opacity=".35"/><stop offset="1" stop-color="#ef5f97" stop-opacity="0"/></radialGradient>
    <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#ff9fc3"/><stop offset=".5" stop-color="#ef5f97"/><stop offset="1" stop-color="#9b7bff"/></linearGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#7dffcf" stop-opacity="0"/><stop offset=".5" stop-color="#7dffcf"/><stop offset="1" stop-color="#7dffcf" stop-opacity="0"/></linearGradient>
    <clipPath id="lens"><circle cx="790" cy="130" r="78"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <rect width="900" height="260" rx="18" fill="url(#g1)"/>
  <rect width="900" height="260" rx="18" fill="url(#g2)"/>
  <rect x=".75" y=".75" width="898.5" height="258.5" rx="18" fill="none" stroke="#ef5f97" stroke-opacity=".35" stroke-width="1.5"/>

  <text x="40" y="58" class="m" font-size="12" letter-spacing="3" fill="#ff9fc3">DEEP LEARNING · COMPUTATIONAL PATHOLOGY</text>
  <text x="38" y="118" class="s" font-size="58" font-weight="800" fill="url(#title)" filter="url(#glow)">MetaScan</text>
  <text x="40" y="152" class="s" font-size="21" font-weight="700" fill="#f3eef8">Metastatic cancer detection in lymph-node histopathology</text>
  <text x="40" y="180" class="s" font-size="14" fill="#b9aecb">EfficientNetB2 + DenseNet121 · clinical threshold · Grad-CAM · in-browser demo</text>
  <g class="m" font-size="12">
    <rect x="40" y="200" width="150" height="28" rx="14" fill="#7dffcf" fill-opacity=".12" stroke="#7dffcf" stroke-opacity=".6"/>
    <text x="115" y="219" text-anchor="middle" fill="#7dffcf">Kaggle AUC 0.971</text>
    <rect x="200" y="200" width="190" height="28" rx="14" fill="#ef5f97" fill-opacity=".12" stroke="#ef5f97" stroke-opacity=".6"/>
    <text x="295" y="219" text-anchor="middle" fill="#ff9fc3">99.2% sens. (screening)</text>
    <rect x="400" y="200" width="150" height="28" rx="14" fill="#7b4fd6" fill-opacity=".18" stroke="#9b7bff" stroke-opacity=".7"/>
    <text x="475" y="219" text-anchor="middle" fill="#c9b6ff">by Saif Khattab</text>
  </g>

  <!-- microscope lens with H&E cells and a scanning beam -->
  <circle cx="790" cy="130" r="86" fill="none" stroke="#ef5f97" stroke-opacity=".25" stroke-width="10" class="pl"/>
  <circle cx="790" cy="130" r="78" fill="#1d1230"/>
  <g clip-path="url(#lens)">
    <g transform="translate(45 0)"><g class="dr">
      <circle cx="700" cy="85"  r="22" fill="#ef5f97" fill-opacity=".75"/><circle cx="702" cy="86"  r="9"  fill="#5b2fc0"/>
      <circle cx="770" cy="72"  r="16" fill="#ef5f97" fill-opacity=".7"/> <circle cx="771" cy="73"  r="6"  fill="#5b2fc0"/>
      <circle cx="800" cy="125" r="21" fill="#ef5f97" fill-opacity=".75"/><circle cx="798" cy="127" r="8"  fill="#5b2fc0"/>
      <circle cx="725" cy="140" r="18" fill="#ef5f97" fill-opacity=".7"/> <circle cx="726" cy="141" r="7"  fill="#5b2fc0"/>
      <circle cx="770" cy="180" r="15" fill="#ef5f97" fill-opacity=".7"/> <circle cx="771" cy="181" r="6"  fill="#5b2fc0"/>
      <circle cx="690" cy="175" r="13" fill="#ef5f97" fill-opacity=".65"/><circle cx="690" cy="176" r="5"  fill="#5b2fc0"/>
      <circle cx="815" cy="175" r="11" fill="#ef5f97" fill-opacity=".65"/><circle cx="815" cy="176" r="4"  fill="#5b2fc0"/>
      <circle cx="665" cy="128" r="12" fill="#ef5f97" fill-opacity=".6"/> <circle cx="665" cy="129" r="5"  fill="#5b2fc0"/>
    </g></g>
    <g class="scan"><rect x="710" y="128" width="180" height="4" fill="url(#beam)" filter="url(#glow)"/></g>
  </g>
  <circle cx="790" cy="130" r="78" fill="none" stroke="#ef5f97" stroke-width="2.5" filter="url(#glow)"/>
</svg>
